<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Strategies</title>

    <link href="css/site.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <div class="d-flex justify-content-between">

            <h2>Strategies</h2>

            <button id="btnNewStrategy" class="btn btn-primary">

                New Strategy

            </button>

        </div>

        <hr>

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Type</th>

                    <th>Description</th>

                    <th width="160">

                        Action

                    </th>

                </tr>

            </thead>

            <tbody id="strategyTable">

            </tbody>

        </table>

    </div>

    <div class="modal fade" id="strategyModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 id="strategyModalTitle" class="modal-title">

                        Strategy

                    </h5>

                    <button class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label>Name</label>

                        <input id="strategyName" class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Description</label>

                        <textarea id="strategyDescription" class="form-control" rows="2"></textarea>

                    </div>

                    <div class="mb-3">

                        <label>Strategy Type</label>

                        <select id="strategyType" class="form-select">

                            <option value="EMA_RSI_ADX">
                                EMA + RSI + ADX
                            </option>

                        </select>

                    </div>

                    <hr>

                    <h5>

                        Parameters

                    </h5>

                    <div id="strategyParameters">

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button id="btnSaveStrategy" class="btn btn-primary">

                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="js/strategy/main.js">
    </script>

    <div class="modal fade" id="strategyModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 id="strategyModalTitle" class="modal-title">

                        Strategy

                    </h5>

                    <button class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label>Name</label>

                        <input id="strategyName" class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Description</label>

                        <textarea id="strategyDescription" class="form-control" rows="2"></textarea>

                    </div>

                    <div class="mb-3">

                        <label>Strategy Type</label>

                        <select id="strategyType" class="form-select">

                            <option value="EMA_RSI_ADX">
                                EMA + RSI + ADX
                            </option>

                        </select>

                    </div>

                    <hr>

                    <h5>

                        Parameters

                    </h5>

                    <div id="strategyParameters">

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button id="btnSaveStrategy" class="btn btn-primary">

                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
