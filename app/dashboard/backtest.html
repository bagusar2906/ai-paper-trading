<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Paper Trading - Backtest</title>

     <link rel="icon" href="/ui/favicon.ico" type="image/x-icon">

    <link href="css/site.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">

                Paper Trading

            </a>


            <div class="navbar-nav">

                <a class="nav-link" href="index.html">

                    Dashboard

                </a>

                <a class="nav-link active" href="backtest.html">

                    Backtest

                </a>

                <a class="nav-link" href="strategy.html">

                    Strategies

                </a>

            </div>

        </div>

    </nav>

    <div class="container-fluid mt-4">

        <h2>

            Backtesting

        </h2>

        <hr>

        <!-- ================================================= -->
        <!-- Strategy / Profile -->
        <!-- ================================================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row align-items-end">

                    <div class="col-md-4">

                        <label class="form-label">

                            Strategy

                        </label>

                        <select id="btStrategy" class="form-select">

                        </select>

                    </div>

              <!--       <div class="col-md-4">

                        <label class="form-label">

                            Profile

                        </label>

                        <select id="btProfile" class="form-select">

                            <option>

                                Loading...

                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 text-end">

                        <button id="btnSaveProfile" class="btn btn-outline-primary">

                            Save

                        </button>

                        <button id="btnSaveAsProfile" class="btn btn-outline-success">

                            Save As

                        </button>

                        <button id="btnDeleteProfile" class="btn btn-outline-danger">

                            Delete

                        </button>

                    </div>
 -->
                </div>

            </div>

        </div>

        <!-- ================================================= -->
        <!-- Top -->
        <!-- ================================================= -->

        <div class="row">

            <!-- ========================================= -->
            <!-- Configuration -->
            <!-- ========================================= -->

            <div class="col-lg-4">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <strong>

                            Configuration

                        </strong>

                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label class="form-label">

                                Symbol

                            </label>

                            <input id="btSymbol" class="form-control" value="XAUUSD">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Timeframe

                            </label>

                            <select id="btTimeframe" class="form-select">

                                <option>M1</option>
                                <option>M5</option>
                                <option selected>M15</option>
                                <option>H1</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                History Bars

                            </label>

                            <input id="btBars" class="form-control" type="number" value="5000">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Initial Balance

                            </label>

                            <input id="btBalance" class="form-control" type="number" value="10000">

                        </div>

                        <hr>

                        <h5>

                            Strategy Parameters

                        </h5>

                        <div id="strategyParameters">

                            <!-- Filled dynamically -->

                        </div>

                        <hr>

                        <button id="btnRunBacktest" class="btn btn-primary w-100">

                            ▶ Run Backtest

                        </button>

                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- Summary -->
            <!-- ========================================= -->

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <strong>

                            Backtest Summary

                        </strong>

                    </div>

                    <div id="backtestSummary" class="card-body">

                    </div>

                </div>

            </div>

        </div>

        <!-- ================================================= -->
        <!-- Progress -->
        <!-- ================================================= -->

        <div id="backtestLoading" class="card mt-4 hidden">

            <div class="card-body">

                <div id="backtestStatus">

                    Waiting...

                </div>

                <progress id="backtestProgress" max="100" value="0">

                </progress>

                <span id="backtestPercent">

                    0%

                </span>

            </div>

        </div>

        <!-- ================================================= -->
        <!-- Price -->
        <!-- ================================================= -->

        <div class="card shadow-sm mt-4">

            <div class="card-header">

                <strong>

                    Price Chart

                </strong>

            </div>

            <div class="card-body">

                <div id="backtestPriceChart" style="height:550px">

                </div>

            </div>

        </div>

        <!-- ================================================= -->
        <!-- Equity -->
        <!-- ================================================= -->

        <div class="card shadow-sm mt-4">

            <div class="card-header">

                <strong>

                    Equity Curve

                </strong>

            </div>

            <div class="card-body">

                <div id="backtestEquityChart" style="height:250px">

                </div>

            </div>

        </div>

        <!-- ================================================= -->
        <!-- Trades -->
        <!-- ================================================= -->

        <div class="mt-4">

            <button id="btnToggleTrades" class="btn btn-outline-secondary">

                Show Trade History

            </button>

        </div>

        <div id="tradeHistoryContainer" style="display:none;">

            <table class="table table-striped mt-3">

                <thead>

                    <tr>

                        <th>#</th>
                        <th>Time</th>
                        <th>Side</th>
                        <th>Entry</th>
                        <th>Exit</th>
                        <th>PnL</th>

                    </tr>

                </thead>

                <tbody id="btTrades">

                </tbody>

            </table>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script type="module" src="js/backtest/main.js">
    </script>

</body>

</html>
