<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Paper Trading Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid mt-3">

    <h2>Paper Trading Dashboard</h2>

    <div class="row mt-4">

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Balance</h6>
                    <h3 id="balance">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Equity</h6>
                    <h3 id="equity">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Floating P/L</h6>
                    <h3 id="floating">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Open Positions</h6>
                    <h3 id="positionCount">0</h3>
                </div>
            </div>
        </div>

    </div>

    <hr>

    <h4>Open Positions</h4>

    <table class="table table-striped" id="positionsTable">
        <thead>
        <tr>
            <th>Symbol</th>
            <th>Side</th>
            <th>Entry</th>
            <th>SL</th>
            <th>TP</th>
        </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>

<script src="js/dashboard.js"></script>

</body>

</html>
